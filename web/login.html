<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Sign in · HardlyListening</title>
<style>
  :root{ --bg:#0b0b10; --panel:#15151c; --panel2:#1d1d26; --line:#2a2a35;
    --text:#ececf1; --dim:#9595a4; --accent:#58d3a8; --err:#ff6b6b; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:
    radial-gradient(1200px 600px at 50% -10%, #17222b 0%, var(--bg) 60%);
    color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:24px}
  .brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  h1{font-size:15px;font-weight:600;margin:18px 0 6px}
  p{margin:0 0 14px;color:var(--dim);font-size:13px}
  a{color:var(--accent)}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);margin:12px 0 6px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px 12px;font:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:16px;background:var(--accent);color:#08110d;border:0;
    border-radius:10px;padding:11px 12px;font:inherit;font-weight:650;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:14px;font-size:13px;line-height:1.45}
  .msg.err{color:var(--err)}
  .fine{margin-top:18px;color:var(--dim);font-size:11.5px}
  .sep{margin:20px 0 0;border-top:1px solid var(--line);padding-top:14px}
  html,body{touch-action:manipulation}
  @media (max-width:760px){html,body{touch-action:pan-x pan-y}}
  input,select,textarea{font-size:16px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Hardly<span>Listening</span></div>
  <h1>Sign in</h1>
  <p>Your email and password, or the personal login link you were given.</p>
  <form id="signin">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="email" spellcheck="false">
    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button type="submit" id="go">Sign in</button>
  </form>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div class="sep">
    <h1>Have a personal login link?</h1>
    <p>Open it from the message that carried it — it signs you in and stays yours. There is no
      public sign-up: joining needs a signup link from someone already here.</p>
  </div>
</main>
<script>
const msg = document.getElementById("msg");
const go = document.getElementById("go");
const form = document.getElementById("signin");

// A same-site request from here carries the session cookie, so somebody who is already signed in
// gets sent straight in instead of being asked again.
fetch("/api/state", {headers: {"Accept": "application/json"}})
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d && d.viewer && d.viewer.display_name) location.replace("/"); })
  .catch(() => {});

form.onsubmit = event => {
  event.preventDefault();
  go.disabled = true;
  msg.className = "msg";
  msg.textContent = "";
  fetch("/api/auth/login/password", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    }),
  }).then(async response => {
    const data = await response.json().catch(() => ({}));
    if (response.ok) { location.replace("/"); return; }
    go.disabled = false;
    msg.className = "msg err";
    msg.textContent = data.error || "Sign-in failed";
  }).catch(() => {
    go.disabled = false;
    msg.className = "msg err";
    msg.textContent = "Could not reach the server";
  });
};
</script>
</body></html>
