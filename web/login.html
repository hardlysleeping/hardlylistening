<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Sign in · HardlyListening</title>
<style>
  :root{ --bg:#0b0b10; --panel:#15151c; --panel2:#1d1d26; --line:#2a2a35;
    --text:#ececf1; --dim:#9595a4; --accent:#58d3a8; --err:#ff6b6b; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:
    radial-gradient(1200px 600px at 50% -10%, #17222b 0%, var(--bg) 60%);
    color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:24px}
  .brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  h1{font-size:15px;font-weight:600;margin:18px 0 6px}
  p{margin:0 0 14px;color:var(--dim);font-size:13px}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);margin-bottom:6px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px 12px;font:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:12px;background:var(--accent);color:#08110d;border:0;
    border-radius:10px;padding:11px 12px;font:inherit;font-weight:650;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:14px;font-size:13px;line-height:1.45}
  .msg.err{color:var(--err)}
  .msg.ok{color:var(--accent)}
  .fine{margin-top:18px;color:var(--dim);font-size:11.5px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Hardly<span>Listening</span></div>
  <h1>Invitation required</h1>
  <p>Ask an administrator for a one-time invitation link. Open it on this browser to sign in for 30 days. No email or password is required.</p>
  <p>Lost access? Ask an administrator for a new link. Do not share invitation links.</p>
</main></body></html>
