<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>Swipe · HardlyListening</title>
<link rel="stylesheet" href="/swipe.css">
<script src="/swipe.js" defer></script></head>
<body>
<main>
  <header class="swhead">
    <a href="/" class="back">‹ Library</a>
    <h1>Swipe</h1>
    <p class="hint">Repository songs you don't own yet. Drag right to keep (adds to your library), left to drop, up to superlike (adds and likes). Tap to hear it.</p>
    <p class="counts" id="counts" role="status" aria-live="polite"></p>
  </header>
  <p id="error" role="alert"></p>
  <section id="deck" aria-label="Song cards"></section>
  <div class="actions" id="actions">
    <button id="drop" type="button" aria-label="Drop">✕<small>drop</small></button>
    <button id="like" type="button" aria-label="Superlike">★<small>like</small></button>
    <button id="keep" type="button" aria-label="Keep">♥<small>keep</small></button>
  </div>
  <audio id="audio" preload="none"></audio>
  <p class="empty" id="empty" hidden>Nothing left to swipe — every playable Repository song is either in your library or already swiped.</p>
</main>
</body></html>
