<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HardlyListening">
  <!-- HardlyListening: the letters H and L drawn as music notes.
       H = two stems (a beamed pair) with a middle bar and a note head under each stem.
       L = one stem with its foot to the right and a note head at the base.
       Flat plate in the app's background colour, mark in the app accent. -->
  <rect width="512" height="512" fill="#101014"/>
  <g transform="translate(256 256) scale(1.06) translate(-260.5 -263)">
    <g stroke="#58d3a8" stroke-width="34" stroke-linecap="round" fill="none">
      <path d="M104 160 V316"/>
      <path d="M214 160 V316"/>
      <path d="M104 243 H214"/>
      <path d="M324 160 V316"/>
      <path d="M324 286 H435"/>
    </g>
    <g fill="#58d3a8">
      <ellipse cx="104" cy="344" rx="33" ry="22" transform="rotate(-18 104 344)"/>
      <ellipse cx="214" cy="344" rx="33" ry="22" transform="rotate(-18 214 344)"/>
      <ellipse cx="324" cy="344" rx="33" ry="22" transform="rotate(-18 324 344)"/>
    </g>
  </g>
</svg>